[package]
name = "bbq_app"
description = "Australian BBQ: the Rust version (Phase 2: walk around the yard)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Pinned to one Bevy release on purpose: Bevy breaks things every few months.
bevy = { version = "=0.19.1", features = ["system_font_discovery"] }
bbq_core = { path = "../bbq_core" }
bevy_hanabi = "0.19"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "native-tls"] }
serde_json = "1.0.151"
base64 = "0.23.1"
