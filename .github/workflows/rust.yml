name: Rust build

on:
  push:
    paths: ["rust/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries for Bevy
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo build --release
      - name: Package desktop beta
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python tools/package_desktop.py windows target/release/bbq_app.exe target/beta/australian-bbq-windows.zip
          else
            python3 tools/package_desktop.py macos target/release/bbq_app target/beta/australian-bbq-mac.zip
          fi
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Linux'
        with:
          name: australian-bbq-${{ runner.os }}-${{ runner.arch }}
          path: rust/target/beta/*.zip
          if-no-files-found: error
